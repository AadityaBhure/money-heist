<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login | Money Heist</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body>

  <div class="auth-box">
    <h2>Team Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Team Email"
      autocomplete="email"
    />

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    />

    <button id="loginBtn">Login</button>

    <p class="switch">
      New team?
      <a href="register.html">Register here</a>
    </p>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
